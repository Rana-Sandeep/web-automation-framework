name: Automation CI

permissions:
  contents: read
  checks: write
permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 20 * * 1-5'      # nightly (UTC) on weekdays
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression'
        default: 'not @wip'
      browser:
        description: 'Browser'
        type: choice
        options: [ chrome, firefox ]
        default: chrome

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Cucumber + TestNG suite
        run: >
          mvn -B clean test
          -Dheadless=true
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || 'not @wip' }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/extent-report
            target/cucumber-reports
            target/surefire-reports
            logs
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
